services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vps-monitor-dashboard
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DASHBOARD_PIN=${DASHBOARD_PIN}
      - SECRET_KEY=${SECRET_KEY}
      - BACKUP_DIR=/opt/backups
      - OPS_EXECUTOR_URL=http://ops-executor:9092
      - OPS_EXECUTOR_TOKEN=${OPS_EXECUTOR_TOKEN}
    volumes:
      - /opt/backups:/opt/backups:ro
      - ./data:/app/data

    networks:
      - proxy-network
      - dashboard-internal

  ops-executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    container_name: vps-ops-executor
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - OPS_EXECUTOR_TOKEN=${OPS_EXECUTOR_TOKEN}
      - ALLOWED_TARGETS=cv-builder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dashboard-internal

networks:
  proxy-network:
    external: true
  dashboard-internal:
    driver: bridge
