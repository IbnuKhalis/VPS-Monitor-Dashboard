name: CI/CD Pipeline - VPS Monitor Dashboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "Starting deployment for vps-monitor-dashboard..."
            mkdir -p /opt/projects/vps-monitor-dashboard
            cd /opt/projects/vps-monitor-dashboard
            
            # If repo is not yet cloned in destination, git clone will be handled beforehand
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            fi
            
            docker compose build --pull app
            docker compose up -d
            
            echo "Checking container status..."
            docker ps --filter "name=vps-monitor-dashboard" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "Deployment completed successfully!"
